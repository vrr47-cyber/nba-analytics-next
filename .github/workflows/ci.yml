name: foundation-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e 'backend[dev]'
      - run: python -m ruff check backend
      - run: python -m mypy backend/app
      - run: python -m pytest backend/tests
      - run: python -m backend.app.openapi > backend/openapi.json
      - run: python scripts/check_openapi.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run frontend:lint
      - run: pnpm run frontend:test
      - run: pnpm run frontend:build
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/check_repository_hygiene.py
      - run: git diff --check
