name: foundation-ci
on: [push, pull_request]

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e 'backend[dev]'
      - run: python -m ruff check backend
      - run: python -m mypy backend/app
      - run: python -m pytest backend/tests -m 'not integration'
      - run: python -m backend.app.jobs.ingest_teams --provider fixture --validate-only --json
      - run: python -m backend.app.openapi > backend/openapi.json
      - run: python scripts/check_openapi.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase2_test
          POSTGRES_PASSWORD: phase2_test
          POSTGRES_DB: nba_analytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phase2_test -d nba_analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NBA_DATABASE_URL: postgresql+psycopg://phase2_test:phase2_test@localhost:5432/nba_analytics_test
      TEST_DATABASE_URL: postgresql+psycopg://phase2_test:phase2_test@localhost:5432/nba_analytics_test
      NBA_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e 'backend[dev]'
      - run: python -m alembic -c backend/alembic.ini upgrade 0001_phase1_foundation
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m backend.app.jobs.import_dataset_bundle --bundle backend/tests/fixtures/synthetic_bundle --allow-synthetic --json
      - run: python -m backend.app.jobs.import_dataset_bundle --bundle backend/tests/fixtures/synthetic_bundle --allow-synthetic --json
      - run: python -m pytest backend/tests -m integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run frontend:lint
      - run: pnpm run frontend:test
      - run: pnpm run frontend:build

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/check_repository_hygiene.py
      - run: git diff --check
